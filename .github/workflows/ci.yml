name: Enterprise Inventory SaaS CI

on:
  push:
    branches: [ "master", "develop", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  backend-build-and-test:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enterprise_inventory_test_db
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=enterprise_inventory_test_db;Username=inventory_test;Password=test_password_123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore Inventory.sln

      - name: Build solution
        run: dotnet build Inventory.sln --configuration Release --no-restore

      - name: Run Unit, Architecture, and Integration Tests
        run: dotnet test Inventory.sln --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/inventory-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/inventory-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Production Build
        run: npm run build
